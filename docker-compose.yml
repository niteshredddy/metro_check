version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: metrocheck-db
    environment:
      POSTGRES_DB: metrocheck
      POSTGRES_USER: metrocheck
      POSTGRES_PASSWORD: metrocheck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrocheck"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metrocheck-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://metrocheck:metrocheck@db:5432/metrocheck
      JWT_SECRET_KEY: metrocheck-secret-key-change-in-prod
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metrocheck-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  upload_data:
